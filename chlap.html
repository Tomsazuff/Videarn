<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vyber si babu</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial;padding:15px}
h2{color:#ff2a6d;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1e1e1e;border-radius:16px;overflow:hidden;text-align:center;padding-bottom:12px;border:1px solid #333}
.card img{width:100%;height:200px;object-fit:cover}
.card h3{margin:8px 0 2px;font-size:16px}
.card p{margin:0;color:#aaa;font-size:13px}
.btn{background:#ff2a6d;color:#fff;border:none;padding:9px 22px;border-radius:20px;margin-top:8px;font-weight:bold}
.btn:active{transform:scale(0.95)}
</style>
</head>
<body>
<h2>💋 Vyber si babu na chat</h2>
<div class="grid">
<div class="card"><img src="1.jpg"><h3>Veronika, 25</h3><p>📍 Žilina - 2km</p><button class="btn" onclick="location.href='https://t.me/vase_meno'">Písať</button></div>
<div class="card"><img src="2.jpg"><h3>Katka, 26</h3><p>📍 Nitra - 5km</p><button class="btn">Písať</button></div>
<div class="card"><img src="3.jpg"><h3>Simona, 23</h3><p>📍 Trnava - 1km</p><button class="btn">Písať</button></div>
<div class="card"><img src="4.jpg"><h3>Lenka, 27</h3><p>📍 Košice</p><button class="btn">Písať</button></div>
<div class="card"><img src="5.jpg"><h3>Petra, 24</h3><p>📍 Bratislava</p><button class="btn">Písať</button></div>
</div>
</body>
</html>

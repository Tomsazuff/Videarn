<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderátorka - SpoznajMa.sk</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0e0e12;color:#fff;font-family:Inter,system-ui,sans-serif}
.scrollbar::-webkit-scrollbar{width:6px}
.scrollbar::-webkit-scrollbar-thumb{background:#ff2d78;border-radius:3px}
</style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

<header class="h-14 bg-black border-b border-white/10 flex items-center justify-between px-4 shrink-0">
<div class="font-black text-xl"><span style="color:#ff2d78">Spoznaj</span>Ma.sk <span class="text-[10px] bg-white/10 px-2 py-0.5 rounded ml-2">MODERÁTORKA</span></div>
<div class="flex gap-3 items-center">
<div id="credits" class="text-sm">Kredity: <b id="cred">127</b></div>
<button class="bg-[#ff2d78] px-4 py-1.5 rounded-full text-sm font-bold">Online</button>
</div>
</header>

<div class="flex flex-1 overflow-hidden">

<!-- STĹPEC 1 - ŽENY -->
<div class="w-[280px] border-r border-white/10 flex flex-col shrink-0">
<div class="p-3 border-b border-white/10">
<input id="search" placeholder="Hľadať..." class="w-full bg-white/5 border border-white/10 rounded-full px-4 py-2 text-sm outline-none">
</div>
<div id="women" class="flex-1 overflow-y-auto scrollbar p-2 space-y-2"></div>
</div>

<!-- STĹPEC 2 - CHAT -->
<div class="flex-1 flex flex-col bg-[#15151c]">
<div id="chatHeader" class="h-16 border-b border-white/10 flex items-center gap-3 px-4">
<img id="chAvatar" src="./1.jpg" class="w-10 h-10 rounded-full object-cover">
<div><div id="chName" class="font-bold">Veronika 24</div><div class="text-xs text-green-400">● Online • píše...</div></div>
</div>
<div id="messages" class="flex-1 overflow-y-auto scrollbar p-4 space-y-3"></div>
<div class="p-3 border-t border-white/10 flex gap-2">
<input id="msgInput" placeholder="Napíš správu..." class="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2.5 text-sm outline-none">
<button onclick="send()" class="bg-[#ff2d78] w-10 h-10 rounded-full font-bold">➤</button>
</div>
</div>

<!-- STĹPEC 3 - PROFIL + KOLOTOČ -->
<div class="w-[340px] border-l border-white/10 flex flex-col shrink-0 bg-[#0e0e12]">
<div class="p-4">
<img id="bigPhoto" src="./1.jpg" class="w-full h-[260px] object-cover rounded-2xl">
<h2 id="bigName" class="font-black text-xl mt-3">Veronika, 24</h2>
<p id="bigCity" class="text-sm opacity-60">Bratislava • 1.2 km</p>
<div class="flex gap-2 mt-3">
<button class="flex-1 bg-[#ff2d78] py-2 rounded-full text-sm font-bold">Poslať foto</button>
<button class="flex-1 bg-white/10 py-2 rounded-full text-sm">Blokovať</button>
</div>
</div>
<div class="border-t border-white/10 p-3 flex-1 overflow-hidden flex flex-col">
<div class="flex justify-between items-center mb-2"><span class="text-xs font-bold opacity-60">KOLOTOČ (FIFO)</span><span id="queueCount" class="text-xs bg-[#ff2d78] px-2 py-0.5 rounded-full">5</span></div>
<div id="carousel" class="flex-1 overflow-y-auto scrollbar space-y-2"></div>
</div>
</div>

</div>

<script>
const WOMEN=[
{name:"Veronika",age:24,city:"Bratislava",photo:"./1.jpg",dist:"1.2 km",online:true,msg:"Ahoj, čo robíš? 😘"},
{name:"Katka",age:22,city:"Košice",photo:"./2.jpg",dist:"0.8 km",online:true,msg:"Si tu?"},
{name:"Simona",age:26,city:"Žilina",photo:"./3.jpg",dist:"2.1 km",online:false,msg:"Máš chvíľu?"},
{name:"Lenka",age:23,city:"Nitra",photo:"./4.jpg",dist:"3.4 km",online:true,msg:"Ahojky 🥰"},
{name:"Petra",age:25,city:"Prešov",photo:"./5.jpg",dist:"1.7 km",online:true,msg:"Čauko"},
];
let active=0;
let fifo=[...WOMEN];

function renderWomen(){
const box=document.getElementById('women'); box.innerHTML='';
WOMEN.forEach((w,i)=>{
box.innerHTML+=`
<div onclick="select(${i})" class="flex gap-3 p-2 rounded-xl cursor-pointer hover:bg-white/5 ${active===i?'bg-[#ff2d78]/10 border border-[#ff2d78]/30':''}">
<img src="${w.photo}" class="w-12 h-12 rounded-full object-cover">
<div class="flex-1 min-w-0"><div class="font-bold text-sm flex gap-2">${w.name}, ${w.age} ${w.online?'<span class=w-2 h-2 bg-green-400 rounded-full inline-block></span>':''}</div><div class="text-xs opacity-60 truncate">${w.city} • ${w.dist}</div><div class="text-xs opacity-80 truncate">${w.msg}</div></div>
</div>`;
});
}

function renderCarousel(){
const box=document.getElementById('carousel'); box.innerHTML='';
fifo.forEach((w,i)=>{
box.innerHTML+=`
<div class="flex gap-2 p-2 rounded-lg bg-white/5 text-xs">
<img src="${w.photo}" class="w-8 h-8 rounded-full object-cover">
<div class="flex-1"><b>${w.name}</b> • ${w.city}<br><span class="opacity-60">${w.msg}</span></div>
</div>`;
});
document.getElementById('queueCount').innerText=fifo.length;
}

function select(i){
active=i; const w=WOMEN[i];
document.getElementById('chAvatar').src=w.photo;
document.getElementById('chName').innerText=w.name+" "+w.age;
document.getElementById('bigPhoto').src=w.photo;
document.getElementById('bigName').innerText=w.name+", "+w.age;
document.getElementById('bigCity').innerText=w.city+" • "+w.dist;
renderWomen();
addMsg(w.msg,false);
}

function addMsg(t,me){
const m=document.getElementById('messages');
const d=document.createElement('div');
d.className=me?'flex justify-end':'flex justify-start';
d.innerHTML=`<div class="${me?'bg-[#ff2d78]':'bg-white/10'} px-4 py-2 rounded-2xl max-w-[80%] text-sm">${t}</div>`;
m.appendChild(d); m.scrollTop=m.scrollHeight;
}

function send(){
const inp=document.getElementById('msgInput'); if(!inp.value.trim()) return;
addMsg(inp.value,true);
// FIFO - posuň aktuálnu na koniec
const moved=fifo.splice(active,1)[0];
fifo.push(moved);
renderCarousel();
let c=parseInt(document.getElementById('cred').innerText); document.getElementById('cred').innerText=c-1;
inp.value='';
setTimeout(()=>addMsg("Hmm 😍 a čo ďalej?",false),900);
}

renderWomen(); renderCarousel();
select(0);
addMsg("Ahoj, si moderátorka? Potrebujem odpovedať chlapom 💬",false);
</script>
</body>
</html>

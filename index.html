<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderátorka v4.2 - FIFO Kolotoč</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    *{font-family:Inter,sans-serif}
    body{background:#0e0e12;color:#fff;overflow:hidden}
  </style>
</head>
<body class="h-screen flex flex-col">

  <!-- HEADER -->
  <header class="h-[54px] bg-black border-b border-white/10 flex items-center justify-between px-4">
    <div class="font-black text-[20px]">
      <span class="text-[#ff2d78]">Spoznaj</span>Ma.sk
      <span class="text-[10px] bg-[#ff2d78] px-2 py-0.5 rounded ml-2">MOD v4.2</span>
    </div>
    <div class="text-xs opacity-60">Chlapi: 11 | Kredity: 127</div>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <!-- LAVY STLP - CHLAP -->
    <div class="w-[320px] border-r border-white/10 bg-[#111118] flex flex-col">
      <div class="p-4 border-b border-white/10 flex gap-3">
        <img id="guyPhoto" class="w-14 h-14 rounded-full object-cover">
        <div>
          <div id="guyName" class="font-bold"></div>
          <div id="guyCity" class="text-xs opacity-60"></div>
          <div class="text-[11px] mt-1"><span class="w-2 h-2 bg-green-400 rounded-full inline-block"></span> Online</div>
        </div>
      </div>
      <div class="p-2 flex-1 overflow-auto">
        <div class="text-[10px] font-black opacity-30 px-2 py-2">
          KOLOTOČ <span id="fifoLen" class="bg-[#ff2d78] px-2 py-0.5 rounded-full ml-2"></span>
        </div>
        <div id="fifoList" class="space-y-1"></div>
      </div>
    </div>

    <!-- STRED - CHAT -->
    <div class="flex-1 flex flex-col bg-[#15151e]">
      <div class="h-[56px] border-b border-white/10 flex items-center gap-3 px-4 bg-[#111118]">
        <img id="activeAvatar" src="./1.jpg" class="w-9 h-9 rounded-full object-cover">
        <div id="activeName" class="font-bold text-sm"></div>
      </div>
      <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <div class="p-3 border-t border-white/10 bg-[#111118] flex gap-2">
        <input id="msgInput" placeholder="Napíš odpoveď ako Veronika..." class="flex-1 bg-white/10 border border-white/10 rounded-full px-5 py-3 text-sm outline-none">
        <button id="sendBtn" class="bg-[#ff2d78] w-11 h-11 rounded-full font-bold">➤</button>
      </div>
    </div>

    <!-- PRAVY STLP - ZENY TVOJE FOTKY 1-5.jpg -->
    <div class="w-[340px] border-l border-white/10 bg-[#0e0e12] flex flex-col">
      <div class="p-4">
        <img id="womanBig" src="./1.jpg" class="w-full h-[300px] object-cover rounded-[18px] border border-white/10">
        <h2 id="womanName" class="font-black text-[20px] mt-3"></h2>
        <p id="womanMeta" class="text-xs opacity-60"></p>
      </div>
      <div class="px-4 py-2 border-t border-white/10 text-[10px] font-black opacity-30">ŽENY -./1.jpg až./5.jpg</div>
      <div id="womenPick" class="px-3 pb-3 grid grid-cols-5 gap-2"></div>
    </div>

  </div>

<script>
const WOMEN = [
  {id:1, name:"Veronika", age:24, city:"Bratislava", photo:"./1.jpg"},
  {id:2, name:"Katka", age:22, city:"Košice", photo:"./2.jpg"},
  {id:3, name:"Simona", age:26, city:"Žilina", photo:"./3.jpg"},
  {id:4, name:"Lenka", age:23, city:"Nitra", photo:"./4.jpg"},
  {id:5, name:"Petra", age:25, city:"Prešov", photo:"./5.jpg"},
];

const MALE = ["Marek","Tomáš","Peter","Martin","Ján","Lukáš","Michal","Jozef","Andrej","Patrik","Filip"];
const CITIES = ["Bratislava","Košice","Žilina","Nitra","Prešov","Trnava"];
const MSGS = ["Ahoj, čo robíš? 😊","Si tu?","Ahojky, pokecáme?","Máš chvíľu?","Čauko","Ahoj, môžeme pokecať?"];

const rand = a => a[Math.floor(Math.random()*a.length)];
const makeGuy = id => ({
  id, name: rand(MALE), age: 22+Math.floor(Math.random()*18),
  city: rand(CITIES), dist: (0.5+Math.random()*4).toFixed(1),
  photo: `https://i.pravatar.cc/150?img=${id+10}`,
  lastMsg: rand(MSGS)
});

let queue = Array.from({length:11}, (_,i)=>makeGuy(i+1));
let activeIdx = 0;
let activeWoman = WOMEN[0];

function render(){
  let guy = queue[activeIdx];
  if(!guy) return;
  document.getElementById('guyPhoto').src = guy.photo;
  document.getElementById('guyName').textContent = guy.name+', '+guy.age;
  document.getElementById('guyCity').textContent = guy.city+' • '+guy.dist+' km';
  document.getElementById('activeAvatar').src = activeWoman.photo;
  document.getElementById('activeName').textContent = guy.name+' píše s '+activeWoman.name;
  document.getElementById('womanBig').src = activeWoman.photo;
  document.getElementById('womanName').textContent = activeWoman.name+', '+activeWoman.age;
  document.getElementById('womanMeta').textContent = activeWoman.city+' • Online';
  document.getElementById('fifoLen').textContent = queue.length;

  let fl = document.getElementById('fifoList'); fl.innerHTML='';
  queue.forEach((g,i)=>{
    let div=document.createElement('div');
    div.className=`flex gap-2.5 p-2.5 rounded-xl cursor-pointer border ${i===activeIdx?'bg-[#ff2d78]/10 border-[#ff2d78]/30':'bg-white/5 border-white/5'}`;
    div.onclick=()=>{activeIdx=i;render();addMsg(g.lastMsg,false)};
    div.innerHTML=`<img src="${g.photo}" class="w-9 h-9 rounded-full"><div class="flex-1"><div class="font-bold text-[12px]">${g.name}, ${g.age}</div><div class="text-[11px] opacity-60 truncate">${g.lastMsg}</div></div>`;
    fl.appendChild(div);
  });

  let wp=document.getElementById('womenPick'); wp.innerHTML='';
  WOMEN.forEach(w=>{
    let b=document.createElement('button');
    b.className=`relative rounded-xl overflow-hidden border-2 ${w.id===activeWoman.id?'border-[#ff2d78]':'border-transparent'}`;
    b.innerHTML=`<img src="${w.photo}" class="w-full h-[64px] object-cover"><div class="absolute bottom-0 left-0 right-0 bg-black/60 text-[10px] text-center py-0.5">${w.name}</div>`;
    b.onclick=()=>{activeWoman=w;render()};
    wp.appendChild(b);
  });
}

function addMsg(t,me){
  let box=document.getElementById('chatBox');
  let d=document.createElement('div');
  d.className=me?'flex justify-end':'flex justify-start';
  d.innerHTML=`<div class="${me?'bg-[#ff2d78]':'bg-white/10'} px-4 py-2.5 rounded-[18px] max-w-[72%] text-[13px]">${t}</div>`;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}

function send(){
  let inp=document.getElementById('msgInput');
  if(!inp.value.trim()) return;
  addMsg(inp.value,true);
  inp.value='';
  let moved=queue.splice(activeIdx,1)[0];
  queue.push(moved);
  if(activeIdx>=queue.length) activeIdx=0;
  render();
  setTimeout(()=>addMsg(["Hmm 😍 a čo ďalej?","Si zlatý 🥰","Máš fotku?"][Math.floor(Math.random()*3)],false),800);
}

document.getElementById('sendBtn').onclick=send;
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
render();
addMsg(queue[0].lastMsg,false);
</script>
</body>
</html>

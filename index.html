<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpoznajMa.sk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#f8f8fb;color:#111}
.card{background:#fff;border:1px solid #ffdde6;border-radius:28px;padding:20px;margin:12px;box-shadow:0 8px 24px rgba(214,69,124,.08)}
.badge{background:#111;color:#fff;border-radius:999px;padding:6px 12px;font-size:10px;font-weight:800;display:inline-block}
.badge-light{background:#ffe4eb;color:#b81d4a}
.avatar{width:180px;height:180px;border-radius:999px;border:4px solid #fff;object-fit:cover;display:block;margin:16px auto;box-shadow:0 4px 16px rgba(0,0,0,.15);background:#eee}
.btn{background:#111;color:#fff;border-radius:999px;padding:12px 20px;border:0;font-weight:800;cursor:pointer}
.btn-pink{background:#d6457c;color:#fff}
.btn-white{background:#fff;color:#111;border:1px solid #eee}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99;padding:16px;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.box{background:#fff;border-radius:28px;max-width:480px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.warn{background:#fff1f4;border:1px solid #ffdde6;border-radius:16px;padding:12px;font-size:12px;margin:12px 0;color:#7a1f3a}
input{width:100%;height:44px;border-radius:999px;background:#f5f5f7;border:1px solid #eee;padding:0 16px;color:#111;outline:none;margin:6px 0}
</style>
</head>
<body>

<header style="background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #f0f0f0">
<div style="font-size:22px;font-weight:800;color:#111">SpoznajMa<span style="color:#d6457c">.sk</span></div>
<div style="display:flex;gap:8px;align-items:center"><span id="creditBadge" style="background:#f5f5f7;border-radius:999px;padding:6px 12px;font-size:13px;color:#111">0 kr</span><button class="btn btn-pink" onclick="openReg()">Registrovať</button></div>
</header>

<div id="profiles" style="max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;padding:12px"></div>

<div style="max-width:1240px;margin:20px auto;padding:0 20px">
<div style="background:#fff;border:1px solid #ffdde6;border-radius:16px;padding:12px;font-size:11px;color:#8a8a8a;text-align:center">
<b style="color:#111">MODEROVANÝ CHAT 18+ - ZÁBAVNÝ PORTÁL, NIE ZOZNAMKA NA OSOBNÉ STRETNUTIA</b><br>
Ilustračné foto - moderátor. 0,5 kr / správa. 5€=10kr | 10€=20+5%=21kr | 20€=40+10%=44kr | 50€=100+15%=115kr
</div>
</div>

<div id="reg" class="modal"><div class="box"><h2>Registrácia 18+</h2><input id="nick" placeholder="Prezývka"><input id="age" type="number" value="22"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Heslo"><label style="font-size:11px;display:flex;gap:8px;margin:10px 0"><input type="checkbox" id="agree" style="width:16px"> Mám 18+</label><div id="regErr" style="color:#ff5a5a;font-size:12px"></div><button class="btn btn-pink" style="width:100%;margin-top:10px" onclick="doReg()">Vytvoriť účet - 2 kr zdarma</button><button class="btn btn-white" style="width:100%;margin-top:8px" onclick="closeReg()">Zavrieť</button></div></div>

<div id="cred" class="modal"><div class="box"><h2>Dobiť kredity</h2><div id="packs"></div><button class="btn btn-pink" style="width:100%;margin-top:14px" onclick="buyPack()">Zaplatit</button><button class="btn btn-white" style="width:100%;margin-top:8px" onclick="closeCred()">Zavrieť</button></div></div>

<div id="chat" class="modal"><div class="box" style="height:82vh;display:flex;flex-direction:column;padding:0;overflow:hidden"><div style="background:linear-gradient(90deg,#d6457c,#7a1f3a);padding:12px 16px;display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:10px;align-items:center"><img id="chatImg" src="" style="width:40px;height:40px;border-radius:999px;border:2px solid #fff;object-fit:cover"><div id="chatName" style="font-weight:800;color:#fff"></div></div><button onclick="closeChat()" style="background:#0006;border:0;color:#fff;width:32px;height:32px;border-radius:999px">✕</button></div><div class="warn"><span style="color:#d6457c;font-weight:800">Upozornenie:</span> Moderovaný 0,5 kr / správa.</div><div id="msgs" style="flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fafafb"></div><div style="padding:10px;border-top:1px solid #eee;display:flex;gap:8px;background:#fff"><input id="msgInput" placeholder="Napíš správu..." style="flex:1;margin:0"><button class="btn btn-pink" onclick="sendMsg()">Odoslať</button></div></div></div>

<script>
const BASE="https://raw.githubusercontent.com/Tomsazuff/Videarn/main/";
const PROFILES=[
{name:"Linda",age:24,city:"Bratislava",img:BASE+"1.jpg"},
{name:"Blondína",age:26,city:"Nitra",img:BASE+"2.jpg"},
{name:"Kučeravá",age:27,city:"Košice",img:BASE+"3.jpg"},
{name:"Hnedovláska",age:25,city:"Trnava",img:BASE+"4.jpg"},
{name:"Hnedovláska",age:23,city:"Žilina",img:BASE+"5.jpg"},
];
const PACKS=[
{total:10,price:"5€",label:"10 kr = 20 správ"},
{total:21,price:"10€",label:"+5% = 21 kr"},
{total:44,price:"20€",label:"+10% = 44 kr"},
{total:115,price:"50€",label:"+15% = 115 kr"},
];
let credits=0,isReg=false,selectedPack=2;
function renderProfiles(){
  const el=document.getElementById('profiles');el.innerHTML='';
  PROFILES.forEach(p=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<div style="display:flex;justify-content:space-between"><span class="badge">ILUSTRAČNÁ FOTKA - MODERÁTOR</span><span class="badge badge-light">Zábavný chat</span></div>
    <img class="avatar" src="${p.img}">
    <div style="font-size:24px;font-weight:800;color:#111">${p.name}, ${p.age}</div>
    <div style="font-size:13px;color:#666">${p.city} • Práve online</div>
    <div class="warn"><span style="color:#d6457c;font-weight:800">Upozornenie:</span> Moderovaný 0,5 kr / správa, zábavný portál.</div>
    <div style="display:flex;gap:8px"><button class="btn btn-pink" style="flex:1">Napísať správu</button><button class="btn btn-white">Kredity</button></div>`;
    d.querySelectorAll('button')[0].onclick=()=>writeMsg(p);
    d.querySelectorAll('button')[1].onclick=()=>openCred();
    el.appendChild(d);
  });
}
function openReg(){document.getElementById('reg').classList.add('open')}
function closeReg(){document.getElementById('reg').classList.remove('open')}
function openCred(){renderPacks();document.getElementById('cred').classList.add('open')}
function closeCred(){document.getElementById('cred').classList.remove('open')}
function renderPacks(){
  const el=document.getElementById('packs');el.innerHTML='';
  PACKS.forEach((p,i)=>{
    const div=document.createElement('div');
    div.style.cssText='border:1px solid '+(selectedPack===i?'#d6457c':'#eee')+';border-radius:16px;padding:12px;margin:8px 0;cursor:pointer;background:'+(selectedPack===i?'#fff1f4':'#fafafa');
    div.innerHTML='<b>'+p.total+' kr za '+p.price+'</b> - '+p.label;
    div.onclick=()=>{selectedPack=i;renderPacks()};
    el.appendChild(div);
  });
}
function doReg(){if(Number(document.getElementById('age').value)<18){document.getElementById('regErr').innerText='18+';return}isReg=true;credits+=2;document.getElementById('creditBadge').innerText=credits+' kr';closeReg();}
function writeMsg(p){if(!isReg){openReg();return}document.getElementById('chatImg').src=p.img;document.getElementById('chatName').innerText=p.name;document.getElementById('chat').classList.add('open')}
function closeChat(){document.getElementById('chat').classList.remove('open')}
function sendMsg(){const inp=document.getElementById('msgInput');const txt=inp.value.trim();if(!txt)return;if(credits<0.5){openCred();return}credits=Math.round((credits-0.5)*10)/10;document.getElementById('creditBadge').innerText=credits+' kr';const el=document.getElementById('msgs');const div=document.createElement('div');div.style.cssText='display:flex;justify-content:flex-end';div.innerHTML='<div style="background:#d6457c;color:#fff;border-radius:18px;padding:10px 14px;max-width:78%">'+txt+'</div>';el.appendChild(div);inp.value='';el.scrollTop=el.scrollHeight;}
function buyPack(){credits+=PACKS[selectedPack].total;document.getElementById('creditBadge').innerText=credits+' kr';closeCred();}
renderProfiles();
</script>
</body>
</html>

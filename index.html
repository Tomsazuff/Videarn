<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidEarn</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#222;
}
header{
  background:#111827;
  color:white;
  text-align:center;
  padding:25px;
}
header h1{margin:0;font-size:36px}
.container{
  max-width:700px;
  margin:30px auto;
  padding:15px;
}
.card{
  background:white;
  padding:25px;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 4px 15px #0001;
}
.balance{
  font-size:24px;
  font-weight:bold;
}
button{
  background:#2563eb;
  color:white;
  border:0;
  padding:14px 25px;
  border-radius:8px;
  font-size:16px;
}
button:disabled{
  background:#94a3b8;
}
.video{
  background:#e2e8f0;
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  font-size:22px;
}
footer{
  text-align:center;
  padding:25px;
  color:#64748b;
}
</style>
</head>

<body>

<header>
<h1>VidEarn</h1>
<p>Sleduj videá a získavaj kredity</p>
</header>

<div class="container">

<div class="card">
<h2>💰 Tvoj zostatok</h2>
<p class="balance" id="balance">0,00 €</p>
</div>

<div class="card">
<h2>🎬 Dostupná úloha</h2>

<div class="video">
  <iframe
    width="100%"
    height="220"
    src="https://www.youtube.com/embed/M7lc1UVf-VE"
    title="YouTube video"
    frameborder="0"
    allowfullscreen>
  </iframe>
</div>

<p>Dokonči 10-sekundovú demo úlohu.</p>

<p>Čas: <strong id="timer">10</strong> sekúnd</p>

<button id="start">Spustiť úlohu</button>
<button id="complete" disabled>Dokončiť úlohu</button>

<p id="message"></p>
</div>

</div>
<div class="card">
  <h2>📜 História</h2>
  <p id="history">Zatiaľ žiadne záznamy.</p>
</div>
<footer>
© 2026 VidEarn
</footer>

<script>
let balance = Number(localStorage.getItem("videarn_balance")) || 0;
let time = 10;
let interval;

const timer = document.getElementById("timer");
const start = document.getElementById("start");
const complete = document.getElementById("complete");
const balanceText = document.getElementById("balance");
const message = document.getElementById("message");
  const history = document.getElementById("history");
  const savedHistory = localStorage.getItem("videarn_history");

if (savedHistory) {
  history.innerHTML = savedHistory;
  }
balanceText.textContent =
  balance.toFixed(2).replace(".", ",") + " €";
start.onclick = function(){

  start.disabled = true;
  time = 10;
  timer.textContent = time;

  interval = setInterval(function(){

    time--;
    timer.textContent = time;

    if(time <= 0){
      clearInterval(interval);
      complete.disabled = false;
      message.textContent = "Úloha je pripravená na dokončenie.";
    }

  },1000);
};

complete.onclick = function(){

  balance += 0.01;
  const oldHistory = localStorage.getItem("videarn_history") || "";
const newEntry = "Úloha dokončená — +0,01 €";
localStorage.setItem("videarn_history", oldHistory + newEntry + "<br>");
history.innerHTML = oldHistory + newEntry + "<br>";
localStorage.setItem("videarn_balance", balance);
  balanceText.textContent =
    balance.toFixed(2).replace(".", ",") + " €";

  complete.disabled = true;
  start.disabled = false;

  message.textContent =
    "Úloha dokončená. Pridaný demo kredit 0,01 €.";

};

</script>

</body>
</html>

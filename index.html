<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidEarn – Sleduj a získavaj odmeny</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 17px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 14px 25px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 15px;
      font-weight: bold;
    }

    .video-box {
      margin-top: 30px;
      padding: 25px;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header>
  <h1>VidEarn</h1>
  <p>Sleduj videá a získavaj odmeny</p>
</header>

<div class="container">

  <div class="card">
    <h2>Vitaj vo VidEarn 👋</h2>

    <p>
      Pozerať krátke reklamné videá a plniť úlohy.
      Za splnené úlohy môžeš získavať kredity.
    </p>

    <a href="#" class="button">Registrácia</a>

    <div class="video-box">
      <h3>🎬 Dostupné video</h3>
      <p>Tu budú neskôr zobrazené videá a úlohy.</p>
      <p><strong>Odmena: 0,01 €</strong></p>
    </div>
  </div>

</div>

<footer>
  © 2026 VidEarn
</footer>

</body>
</html>

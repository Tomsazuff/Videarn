<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moderátorka - FIFO</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen flex flex-col bg-[#0e0e12] text-white overflow-hidden">

<header class="h- bg-black border-b border-white/10 flex items-center justify-between px-4">
<div class="font-black text-"><span class="text-[#ff2d78]">Spoznaj</span>Ma.sk <span class="text- bg-[#ff2d78] px-2 py-0.5 rounded ml-2">MOD v4.2</span></div>
<div class="text-xs opacity-60">Chlapi: 11 | Čakajúce: <span id="pending">2</span></div>
</header>

<div class="flex flex-1 overflow-hidden">

<!-- ĽAVO - CHLAP -->
<div class="w- border-r border-white/10 bg-[#111118] flex flex-col">
<div class="p-4 border-b border-white/10">
<img id="guyPhoto" src="https://i.pravatar.cc/150?img=11" class="w- h- rounded-full">
<div id="guyName" class="font-bold mt-2">Marek, 29</div>
<div id="guyCity" class="text-xs opacity-60">Bratislava • 2.3 km</div>
</div>
<div class="p-2 flex-1 overflow-hidden">
<div class="text- font-black opacity-40 px-2 py-2">KOLOTOČ <span id="fifoLen" class="bg-[#ff2d78] px-2 py-0.5 rounded-full ml-2">11</span></div>
<div id="fifoList" class="space-y-1 overflow-y-auto h-full"></div>
</div>
</div>

<!-- STRED - CHAT -->
<div class="flex-1 flex flex-col bg-[#15151e]">
<div class="h- border-b border-white/10 flex items-center gap-3 px-4 bg-[#111118]">
<img id="activeAvatar" src="./1.jpg" class="w-9 h-9 rounded-full object-cover">
<div id="activeName" class="font-bold text-sm">Marek píše s Veronikou</div>
</div>
<div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
<div class="p-3 border-t border-white/10 bg-[#111118] flex gap-2">
<input id="msgInput" placeholder="Napíš odpoveď..." class="flex-1 bg-white/10 rounded-full px-5 py-3 text-sm outline-none">
<button id="sendBtn" class="bg-[#ff2d78] w-11 h-11 rounded-full">➤</button>
</div>
</div>

<!-- PRAVO - TVOJE FOTKY 1-5.jpg -->
<div class="w- border-l border-white/10 bg-[#0e0e12] flex flex-col">
<div class="p-4">
<img id="womanBig" src="./1.jpg" class="w-full h- object-cover rounded-">
<h2 id="womanName" class="font-black text- mt-3">Veronika, 24</h2>
<p id="womanMeta" class="text-xs opacity-60">Bratislava • Online</p>
</div>
<div id="womenPick" class="px-3 grid grid-cols-5 gap-2"></div>
</div>

</div>

<script>
const WOMEN=[
{id:1,name:"Veronika",age:24,city:"Bratislava",photo:"./1.jpg"},
{id:2,name:"Katka",age:22,city:"Košice",photo:"./2.jpg"},
{id:3,name:"Simona",age:26,city:"Žilina",photo:"./3.jpg"},
{id:4,name:"Lenka",age:23,city:"Nitra",photo:"./4.jpg"},
{id:5,name:"Petra",age:25,city:"Prešov",photo:"./5.jpg"},
];
const MALE=["Marek","Tomáš","Peter","Martin","Ján","Lukáš","Michal","Jozef","Andrej","Patrik","Filip"];
const CITIES=["Bratislava","Košice","Žilina","Nitra","Prešov"];
const MSGS=["Ahoj, čo robíš?","Si tu?","Ahojky, pokecáme?","Máš chvíľu?","Čauko"];
const rand=a=>a[Math.floor(Math.random()*a.length)];
const makeGuy=id=>({id,name:rand(MALE),age:22+Math.floor(Math.random()*18),city:rand(CITIES),dist:(Math.random()*4).toFixed(1),photo:`https://i.pravatar.cc/150?img=${id+10}`,lastMsg:rand(MSGS)});
let queue=Array.from({length:11},(_,i)=>makeGuy(i+1));
let activeIdx=0, activeWoman=WOMEN[0];

function render(){
let g=queue[activeIdx];
document.getElementById('guyPhoto').src=g.photo;
document.getElementById('guyName').textContent=g.name+', '+g.age;
document.getElementById('guyCity').textContent=g.city+' • '+g.dist+' km';
document.getElementById('activeAvatar').src=activeWoman.photo;
document.getElementById('activeName').textContent=g.name+' píše s '+activeWoman.name;
document.getElementById('womanBig').src=activeWoman.photo;
document.getElementById('womanName').textContent=activeWoman.name+', '+activeWoman.age;
document.getElementById('womanMeta').textContent=activeWoman.city;
document.getElementById('fifoLen').textContent=queue.length;
let fl=document.getElementById('fifoList'); fl.innerHTML='';
queue.forEach((guy,i)=>{
let div=document.createElement('div');
div.className=`flex gap-2 p-2 rounded-xl cursor-pointer ${i===activeIdx?'bg-[#ff2d78]/20':'bg-white/5'}`;
div.onclick=()=>{activeIdx=i;render();addMsg(guy.lastMsg,false)};
div.innerHTML=`<img src="${guy.photo}" class="w-9 h-9 rounded-full"><div><div class="font-bold text-xs">${guy.name}</div><div class="text- opacity-60">${guy.lastMsg}</div></div>`;
fl.appendChild(div);
});
let wp=document.getElementById('womenPick'); wp.innerHTML='';
WOMEN.forEach(w=>{
let b=document.createElement('button');
b.className=`rounded-xl overflow-hidden border-2 ${w.id===activeWoman.id?'border-[#ff2d78]':'border-transparent'}`;
b.innerHTML=`<img src="${w.photo}" class="w-full h- object-cover"><div class="text- bg-black/60 text-center">${w.name}</div>`;
b.onclick=()=>{activeWoman=w;render()};
wp.appendChild(b);
});
}
function addMsg(t,me){
let box=document.getElementById('chatBox');
let d=document.createElement('div');
d.className=me?'flex justify-end':'flex justify-start';
d.innerHTML=`<div class="${me?'bg-[#ff2d78]':'bg-white/10'} px-4 py-2 rounded- max-w-[70%] text-">${t}</div>`;
box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function send(){
let inp=document.getElementById('msgInput'); if(!inp.value.trim()) return;
addMsg(inp.value,true); inp.value='';
let moved=queue.splice(activeIdx,1)[0]; queue.push(moved);
if(activeIdx>=queue.length) activeIdx=0; render();
}
document.getElementById('sendBtn').onclick=send;
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
render(); addMsg(queue[0].lastMsg,false);
</script>
</body>
</html>

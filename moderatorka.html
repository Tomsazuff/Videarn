<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V6 BIELA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#fff;color:#222;height:100vh;display:flex;flex-direction:column}
.login{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.box{max-width:380px;width:100%;background:#fff;padding:24px;border:1px solid #eee;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
input,textarea{width:100%;padding:14px;margin:6px 0;border:2px solid #ddd;border-radius:12px;font-size:16px;background:#fff}
button{padding:12px;border:none;border-radius:12px;font-weight:900;cursor:pointer}
.pink{background:#ff2a6d;color:#fff;width:100%;padding:16px;font-size:18px;margin-top:10px}
.green{background:#2ecc71;color:#fff;width:100%;padding:14px;margin-top:8px}
.gray{background:#eee;color:#333}
.topbar{height:56px;background:#fff;border-bottom:2px solid #ff2a6d;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.main{flex:1;display:flex;overflow:hidden}
.left{width:30%;background:#fafafa;border-right:1px solid #eee;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column}
.right{width:26%;background:#fafafa;border-left:1px solid #eee;padding:10px;overflow:auto}
.head{padding:10px;background:#f5f5f5;border-bottom:1px solid #eee;font-weight:800;font-size:12px}
.user{padding:10px;border-bottom:1px solid #eee;cursor:pointer;background:#fff}
.user.active{background:#ffe4ea;border-left:4px solid #ff2a6d}
.chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px}
.bub.me{background:#f1f1f1;align-self:flex-start}
.bub.baba{background:#ff2a6d;color:#fff;align-self:flex-end}
.small{font-size:11px;color:#888}
</style></head><body>
<div id="loginPage" class="login">
<div class="box" id="loginBox">
<h2 style="color:#ff2a6d">💋 Login V6 BIELA</h2>
<input id="m" placeholder="meno rene / tomas">
<input id="h" type="password" placeholder="heslo">
<button class="pink" onclick="login()">PRIHLÁSIŤ SA</button>
<div id="err" style="color:red;margin-top:8px"></div>
<div style="display:flex;gap:6px;margin-top:10px"><button class="gray" onclick="fill('rene')">rene</button><button class="gray" onclick="fill('nikol')">nikol</button><button class="gray" onclick="fill('tomas')">tomas</button></div>
<hr style="margin:14px 0">
<div style="background:#f0fff4;border:1px solid #2ecc71;border-radius:12px;padding:12px"><b style="color:#2ecc71">+ Nová</b><button class="green" onclick="showReg()">REGISTROVAŤ</button></div>
<div class="small">Existujú: <span id="list"></span></div>
</div>
<div class="box" id="regBox" style="display:none">
<h2 style="color:#2ecc71">Registrácia</h2>
<input id="rm" placeholder="meno">
<input id="rh" placeholder="heslo">
<input id="rh2" placeholder="heslo znova">
<button class="green" onclick="reg()">VYTVORIŤ</button>
<button class="gray" style="width:100%;margin-top:8px" onclick="showLogin()">Späť</button>
<div id="rerr" style="margin-top:8px"></div>
</div>
</div>
<div id="app" style="display:none;height:100vh;flex-direction:column">
<div class="topbar"><b style="color:#ff2a6d">MODERÁTORKA V6</b><span><b id="who"></b> <button class="gray" onclick="location.reload()">Odhlásiť</button></span></div>
<div class="main">
<div class="left"><div class="head">CHLAPI <span id="cnt"></span></div><div id="userList" style="flex:1;overflow:auto"></div><button class="gray" style="margin:8px" onclick="addTest()">+ Test</button></div>
<div class="center"><div class="head"><span id="chatTitle">Vyber chlapa</span></div><div class="chat" id="chatBox"></div><div style="padding:10px;border-top:1px solid #eee;background:#fafafa"><textarea id="msgIn" rows="2" placeholder="Správa..."></textarea><button class="pink" onclick="send()">Odoslať</button></div></div>
<div class="right"><div class="small">INFO</div><div id="info" class="small" style="margin-top:6px"></div></div>
</div>
</div>
<script>
const DEF={rene:{h:'rene123',maj:true},nikol:{h:'nikol123',maj:false}};
function getMods(){try{let a=JSON.parse(localStorage.getItem('moderatori')||'{}');let b=JSON.parse(localStorage.getItem('mods')||'{}');let m={...DEF};Object.keys(a).forEach(k=>{m[k]=a[k].heslo?{h:a[k].heslo,maj:!!a[k].jeMajitel}:a[k]});Object.keys(b).forEach(k=>{m[k]=b[k]});return m}catch(e){return DEF}}
function saveMod(m,d){let s=JSON.parse(localStorage.getItem('mods')||'{}');s[m]=d;localStorage.setItem('mods',JSON.stringify(s));listMods()}
function fill(n){let mods=getMods();document.getElementById('m').value=n;document.getElementById('h').value=mods[n]?mods[n].h:n+'123'}
function listMods(){document.getElementById('list').innerText=Object.keys(getMods()).join(', ')}
function showReg(){document.getElementById('loginBox').style.display='none';document.getElementById('regBox').style.display='block'}
function showLogin(){document.getElementById('regBox').style.display='none';document.getElementById('loginBox').style.display='block';listMods()}
function reg(){let m=document.getElementById('rm').value.toLowerCase().trim();let h1=document.getElementById('rh').value.trim();let h2=document.getElementById('rh2').value.trim();let e=document.getElementById('rerr');if(!m||!h1){e.innerText='Vyplň';e.style.color='red';return}if(h1!=h2){e.innerText='Nezhodujú';e.style.color='red';return}if(getMods()[m]){e.innerText='Už je';e.style.color='red';return}saveMod(m,{h:h1,maj:false});e.innerText='Vytvorená '+m;e.style.color='green';setTimeout(()=>{showLogin();document.getElementById('m').value=m;document.getElementById('h').value=h1},700)}
let JA=null,SEL=null;
function login(){let m=document.getElementById('m').value.toLowerCase().trim();let h=document.getElementById('h').value.trim();let mods=getMods();let e=document.getElementById('err');if(!mods[m]||mods[m].h!=h){e.innerText='Zlé: '+Object.keys(mods).join(', ');return}JA={meno:m,...mods[m]};document.getElementById('loginPage').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('who').innerText=m+(JA.maj?' 👑':'');renderUsers()}
function getUsers(){try{let a=JSON.parse(localStorage.getItem('users')||'[]');let b=JSON.parse(localStorage.getItem('spoznajma_users')||'[]');let map={};[...a,...b].forEach(u=>{map[u.id||u.meno]=u});return Object.values(map)}catch(e){return[]}}
function saveUsers(u){localStorage.setItem('users',JSON.stringify(u));localStorage.setItem('spoznajma_users',JSON.stringify(u))}
function renderUsers(){let users=getUsers();let keys=Object.keys(getMods());users.forEach((u,i)=>{if(!u.assigned&&!u.assignedTo)u.assigned=keys[i%keys.length];if(u.assignedTo&&!u.assigned)u.assigned=u.assignedTo});saveUsers(users);let zobraz=JA.maj?users:users.filter(u=>(u.assigned||u.assignedTo)===JA.meno||!u.assigned);document.getElementById('cnt').innerText='('+zobraz.length+')';let list=document.getElementById('userList');list.innerHTML='';zobraz.reverse().forEach(u=>{let id=u.id||u.meno;let d=document.createElement('div');d.className='user'+(SEL===id?' active':'');d.innerHTML='<b>'+u.meno+'</b><br><span class=small>'+(u.assigned||'')+'</span>';d.onclick=()=>{SEL=id;renderUsers();renderChat()};list.appendChild(d)})}
function renderChat(){if(!SEL)return;let u=getUsers().find(x=>(x.id||x.meno)===SEL);if(!u)return;document.getElementById('chatTitle').innerText=u.meno;document.getElementById('info').innerHTML='Meno:'+u.meno+'<br>Priradeny:'+(u.assigned||'');let box=document.getElementById('chatBox');box.innerHTML='';(u.messages||[]).forEach(m=>{let d=document.createElement('div');d.className='bub '+(m.from==='baba'?'baba':'me');d.innerText=m.text;box.appendChild(d)});box.scrollTop=box.scrollHeight}
function send(){if(!SEL)return alert('Vyber chlapa');let t=document.getElementById('msgIn').value.trim();if(!t)return;let users=getUsers();let u=users.find(x=>(x.id||x.meno)===SEL);if(!u.messages)u.messages=[];u.messages.push({from:'baba',text:t});saveUsers(users);document.getElementById('msgIn').value='';renderChat()}
function addTest(){let users=getUsers();if(users.length===0)users=[{id:'1',meno:'Peter',assigned:'rene',messages:[{from:'me',text:'Ahoj'}]},{id:'2',meno:'Jan',assigned:'nikol',messages:[]}];else users.push({id:Date.now().toString(),meno:'Test'+users.length,assigned:Object.keys(getMods())[users.length%Object.keys(getMods()).length],messages:[]});saveUsers(users);renderUsers()}
listMods()
</script></body></html>

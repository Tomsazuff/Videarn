<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moderátorka NOVA BIELA</title>
<style>
body{margin:0;background:#fff;color:#222;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:15px}
.box{width:100%;max-width:360px;background:#fff;border:1px solid #eee;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
input{width:100%;padding:14px;margin:6px 0;border:2px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:8px;cursor:pointer}
.pink{background:#ff2a6d;color:#fff}
.green{background:#2ecc71;color:#fff}
.gray{background:#eee;color:#333;width:auto;padding:8px 12px;font-size:13px;margin:3px;display:inline-block}
.dash{text-align:center}
</style>
</head>
<body>

<div id="login" class="box">
<h2 style="color:#ff2a6d;margin:0">💋 Moderátorka</h2>
<p style="color:#888;font-size:13px;margin:4px 0 16px">NOVA BIELA - bez chlapov</p>
<input id="m" placeholder="meno">
<input id="h" type="password" placeholder="heslo">
<button class="pink" onclick="login()">PRIHLÁSIŤ</button>
<p id="err" style="color:red;font-size:13px"></p>
<div style="margin-top:10px">
<button class="gray" onclick="fill('rene')">rene</button>
<button class="gray" onclick="fill('nikol')">nikol</button>
<button class="gray" onclick="fill('tomas')">tomas</button>
</div>
<hr style="margin:16px 0;border:none;border-top:1px solid #eee">
<button class="green" onclick="showReg()">+ REGISTROVAŤ NOVÚ</button>
<div style="font-size:11px;color:#888;margin-top:8px">Existujú: <span id="list"></span></div>
</div>

<div id="reg" class="box" style="display:none">
<h2 style="color:#2ecc71">Nová moderátorka</h2>
<input id="rm" placeholder="meno napr zuzana">
<input id="rh" placeholder="heslo">
<input id="rh2" placeholder="heslo znova">
<button class="green" onclick="reg()">VYTVORIŤ</button>
<button class="gray" style="width:100%;margin-top:10px" onclick="showLogin()">Späť</button>
<p id="rerr" style="font-size:13px"></p>
</div>

<div id="app" class="box dash" style="display:none">
<h2 id="welcome"></h2>
<p style="color:#888">Si prihlásená</p>
<div style="margin-top:20px;display:flex;flex-direction:column;gap:10px">
<button class="pink" onclick="alert('Tu pridáme čo chceš - chat, profil, atd.')">Začať</button>
<button class="gray" style="width:100%" onclick="location.reload()">Odhlásiť</button>
</div>
<div style="margin-top:20px;padding:12px;background:#f9f9f9;border-radius:12px;font-size:12px;color:#888">
Biela verzia - čistá<br>
Pripravená na nový dizajn<br>
Bez chlapov
</div>
</div>

<script>
var mods={rene:'rene123',nikol:'nikol123',tomas:'tomas'};
var saved=JSON.parse(localStorage.getItem('mods_new')||'{}');for(var k in saved)mods[k]=saved[k];
function upd(){document.getElementById('list').innerText=Object.keys(mods).join(', ')}
function fill(n){document.getElementById('m').value=n;document.getElementById('h').value=mods[n]||''}
function showReg(){document.getElementById('login').style.display='none';document.getElementById('reg').style.display='block'}
function showLogin(){document.getElementById('reg').style.display='none';document.getElementById('login').style.display='block';upd()}
function login(){var m=document.getElementById('m').value.toLowerCase().trim();var h=document.getElementById('h').value.trim();if(mods[m]&&mods[m]==h){document.getElementById('login').style.display='none';document.getElementById('reg').style.display='none';document.getElementById('app').style.display='block';document.getElementById('welcome').innerText='Vitaj '+m}else{document.getElementById('err').innerText='Zlé heslo - existujú: '+Object.keys(mods).join(', ')}}
function reg(){var m=document.getElementById('rm').value.toLowerCase().trim();var h1=document.getElementById('rh').value.trim();var h2=document.getElementById('rh2').value.trim();var e=document.getElementById('rerr');if(!m||!h1){e.style.color='red';e.innerText='Vyplň';return}if(h1!=h2){e.style.color='red';e.innerText='Heslá sa nezhodujú';return}if(mods[m]){e.style.color='red';e.innerText='Už existuje';return}mods[m]=h1;var s=JSON.parse(localStorage.getItem('mods_new')||'{}');s[m]=h1;localStorage.setItem('mods_new',JSON.stringify(s));e.style.color='green';e.innerText='Vytvorená '+m;setTimeout(function(){showLogin();fill(m)},700)}
upd();
</script>
</body>
</html>

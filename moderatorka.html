<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderátorka - Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#111;color:#fff;display:flex;height:100vh}
.sidebar{width:300px;background:#1a1a1a;border-right:1px solid #333;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;background:#000}
.head{padding:12px 16px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.list{flex:1;overflow:auto}
.user-item{padding:10px 12px;border-bottom:1px solid #222;cursor:pointer;display:flex;justify-content:space-between}
.user-item.active{background:#ff2a6d}
.user-item.kred{font-size:12px;color:#aaa}
.chat-box{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#0a0a0a}
.bubble{max-width:70%;padding:10px 14px;border-radius:14px;font-size:14px}
.bubble.me{background:#333;color:#fff;align-self:flex-start}
.bubble.baba{background:#ff2a6d;color:#fff;align-self:flex-end}
.input-area{padding:10px;border-top:1px solid #333;display:flex;gap:8px;background:#1a1a1a}
input,textarea{flex:1;background:#222;border:1px solid #333;color:#fff;padding:10px 12px;border-radius:10px;outline:none}
button{background:#ff2a6d;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:800;cursor:pointer}
.small{font-size:11px;color:#888}
.baby-select{display:flex;gap:6px;padding:8px;border-bottom:1px solid #222;flex-wrap:wrap}
.baby-btn{padding:6px 10px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;font-size:12px;cursor:pointer}
.baby-btn.active{background:#ff2a6d;border-color:#ff2a6d}
.stats{padding:10px 12px;background:#222;border-bottom:1px solid #333;font-size:12px}
</style>
</head>
<body>
<div class="sidebar">
<div class="head">
<b style="color:#ff2a6d">💋 MODERÁTORKA</b>
<button onclick="clearAll()" style="background:#333;font-size:11px;padding:6px 10px">Vymazať všetko</button>
</div>
<div class="stats" id="stats"></div>
<div class="baby-select" id="babySelect"></div>
<div class="list" id="userList"></div>
</div>
<div class="main">
<div class="head">
<div><b id="chatTitle">Vyber chlapa</b><div class="small" id="chatSub"></div></div>
<div style="display:flex;gap:8px">
<button onclick="addCredits()" style="background:#2ecc71">+ kredity</button>
<button onclick="location.reload()">↻ Reload</button>
</div>
</div>
<div class="chat-box" id="chatBox"></div>
<div class="input-area">
<textarea id="msgInput" placeholder="Píš za babu... (Enter = odoslať)" rows="2"></textarea>
<button onclick="sendAsBaba()">Odoslať ako baba</button>
</div>
</div>

<script>
const BABY=['Veronika','Katka','Simona','Lenka','Petra'];
let selectedBaba=BABY[0];
let selectedUserId=null;

function renderBabySelect(){
 const c=document.getElementById('babySelect');c.innerHTML='';
 BABY.forEach(b=>{
  const btn=document.createElement('button');
  btn.className='baby-btn'+(selectedBaba===b?' active':'');
  btn.innerText=b;
  btn.onclick=()=>{selectedBaba=b;renderBabySelect();renderUsers();renderChat();};
  c.appendChild(btn);
 });
}
function getUsers(){return JSON.parse(localStorage.getItem('spoznajma_users')||'[]');}
function getAllMsgs(){return JSON.parse(localStorage.getItem('spoznajma_vsetky_spravy')||'[]');}

function renderStats(){
 const users=getUsers(); const msgs=getAllMsgs();
 const totalKr=users.reduce((s,u)=>s+(u.kredity||0),0);
 document.getElementById('stats').innerHTML=`👥 Chlapov: ${users.length} | 💬 Správ: ${msgs.length} | 💰 Kr spolu: ${totalKr}<br><small>Tvrdý paywall - po 2kr STOP</small>`;
}

function renderUsers(){
 const users=getUsers(); const msgs=getAllMsgs();
 const list=document.getElementById('userList');list.innerHTML='';
 // zoradiť podľa poslednej správy
 users.sort((a,b)=>b.id-a.id).forEach(u=>{
  const userMsgs=msgs.filter(m=>m.chlapId===u.id && m.baba===selectedBaba);
  const last=userMsgs[userMsgs.length-1];
  const div=document.createElement('div');
  div.className='user-item'+(selectedUserId===u.id?' active':'');
  div.innerHTML=`<div><b>${u.meno}</b> <span class="small">${u.vek} ${u.mesto}</span><div class="small">${last?last.text.slice(0,30):'žiadna správa pre '+selectedBaba} • ${userMsgs.length} správ</div></div><div class="kred">${u.kredity} kr</div>`;
  div.onclick=()=>{selectedUserId=u.id;renderUsers();renderChat();};
  list.appendChild(div);
 });
}

function renderChat(){
 const box=document.getElementById('chatBox');
 const title=document.getElementById('chatTitle');
 const sub=document.getElementById('chatSub');
 if(!selectedUserId){box.innerHTML='<div class="small" style="text-align:center;margin-top:40px">Vyber chlapa vľavo a babu hore</div>';title.innerText='Vyber chlapa';sub.innerText='';return;}
 const users=getUsers(); const u=users.find(x=>x.id===selectedUserId);
 if(!u)return;
 title.innerText=`${u.meno} ↔ ${selectedBaba}`;
 sub.innerText=`${u.mesto} • ${u.kredity} kr • ${u.vek}r • ID: ${u.id}`;

 // načítaj správy pre tohto chlapa a túto babu
 const key=`msgs_${u.id}_${selectedBaba}`;
 const chat=JSON.parse(localStorage.getItem(key)||'[]');
 box.innerHTML='';
 chat.forEach(m=>{
  const div=document.createElement('div');
  div.className='bubble '+(m.me?'me':'baba');
  div.innerHTML=`<div style="font-size:11px;opacity:.7;margin-bottom:2px">${m.me?u.meno:selectedBaba} • ${m.time||''}</div>${(m.text||'').replace(/</g,'&lt;')}${m.foto?`<br><img src="${m.foto}" style="width:180px;border-radius:8px;margin-top:6px">`:''}`;
  box.appendChild(div);
 });
 box.scrollTop=box.scrollHeight;
}

function sendAsBaba(){
 const input=document.getElementById('msgInput');
 const text=input.value.trim(); if(!text ||!selectedUserId)return;
 const users=getUsers(); const u=users.find(x=>x.id===selectedUserId); if(!u)return;
 const key=`msgs_${u.id}_${selectedBaba}`;
 const chat=JSON.parse(localStorage.getItem(key)||'[]');
 const now=new Date().toLocaleTimeString().slice(0,5);
 chat.push({me:false,text,time:now});
 localStorage.setItem(key,JSON.stringify(chat));
 input.value=''; renderChat();
}

function addCredits(){
 if(!selectedUserId){alert('Vyber chlapa');return}
 const amount=prompt('Koľko kreditov pripísať? (napr. 10)','10'); if(!amount)return;
 const kr=parseFloat(amount); if(isNaN(kr))return;
 let users=getUsers(); let idx=users.findIndex(u=>u.id===selectedUserId);
 if(idx>-1){
  users[idx].kredity=(users[idx].kredity||0)+kr;
  localStorage.setItem('spoznajma_users',JSON.stringify(users));
  let cur=JSON.parse(localStorage.getItem('spoznajma_user')||'null');
  if(cur && cur.id===selectedUserId){cur.kredity=users[idx].kredity;localStorage.setItem('spoznajma_user',JSON.stringify(cur));}
  renderUsers();renderChat();renderStats();
  alert(`Pripísané ${kr} kr pre ${users[idx].meno}`);
 }
}

function clearAll(){
 if(confirm('Vymazať VŠETKO? Všetci chlapi a správy zmiznú!')){
  localStorage.removeItem('spoznajma_users');
  localStorage.removeItem('spoznajma_user');
  localStorage.removeItem('spoznajma_vsetky_spravy');
  // vymaž všetky chaty
  Object.keys(localStorage).forEach(k=>{if(k.startsWith('msgs_'))localStorage.removeItem(k);});
  location.reload();
 }
}

document.getElementById('msgInput').addEventListener('keydown',e=>{
 if(e.key==='Enter' &&!e.shiftKey){e.preventDefault();sendAsBaba();}
});

renderBabySelect();renderStats();renderUsers();renderChat();
setInterval(()=>{renderStats();renderUsers();},3000);
</script>
</body>
</html>

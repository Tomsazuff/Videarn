<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Moderátorka CLOUD - REGISTRÁCIA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#fff;color:#222;height:100vh;display:flex;flex-direction:column}
.login{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;overflow:auto}
.login-box{background:#fff;padding:24px;border-radius:18px;border:1px solid #eee;box-shadow:0 10px 40px rgba(0,0,0,.12);width:100%;max-width:380px}
.login-box input{width:100%;padding:16px;margin:7px 0;background:#fff;border:2px solid #ddd;color:#222;border-radius:12px;font-size:18px}
.login-box input:focus{outline:none;border-color:#ff2a6d}
.btn{background:#fff;border:1px solid #ddd;color:#333;padding:10px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:700;touch-action:manipulation}
.btn.big{background:#ff2a6d;color:#fff;border:none;padding:18px;border-radius:14px;width:100%;font-weight:900;font-size:19px;margin-top:12px}
.btn.green{background:#2ecc71;color:#fff;border:none;padding:16px;border-radius:12px;width:100%;font-weight:900;font-size:16px;margin-top:10px}
.topbar{height:62px;background:#fff;border-bottom:2px solid #ff2a6d;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.main{flex:1;display:flex;overflow:hidden}
.left{width:34%;background:#fafafa;border-right:1px solid #eee;display:flex;flex-direction:column}
.center{flex:1;background:#fff;display:flex;flex-direction:column}
.right{width:28%;background:#fafafa;border-left:1px solid #eee;display:flex;flex-direction:column;overflow:auto}
.head{padding:8px 10px;background:#f5f5f5;border-bottom:1px solid #eee;font-weight:800;font-size:13px}
.user{display:flex;gap:8px;padding:10px;border-bottom:1px solid #f0f0f0;cursor:pointer;background:#fff}
.user.active{background:#ffe4ea;border-left:3px solid #ff2a6d}
.chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bub.me{background:#f1f1f1;align-self:flex-start}
.bub.baba{background:#ff2a6d;color:#fff;align-self:flex-end}
.small{font-size:11px;color:#888}
</style>
</head>
<body>
<div id="login" class="login">
<div class="login-box">
<div id="loginForm">
<h3 style="color:#ff2a6d;font-size:24px">💋 Prihlásenie - V5 REG</h3>
<div class="small" style="margin:6px 0 10px">Verzia s registráciou - 12.10.2026</div>
<input id="modMeno" type="text" placeholder="Meno: rene" autocomplete="username">
<input id="modHeslo" type="password" placeholder="Heslo: rene123" autocomplete="current-password">
<button id="loginBtn" class="btn big" type="button">👉 PRIHLÁSIŤ SA</button>
<div id="loginError" style="color:#ff2a6d;font-size:13px;margin-top:10px;min-height:18px"></div>
<div style="margin-top:12px;display:flex;gap:6px">
<button class="btn" onclick="fill('rene','rene123')">rene</button>
<button class="btn" onclick="fill('nikol','nikol123')">nikol</button>
</div>
<hr style="margin:16px 0;border:none;border-top:2px solid #eee">
<div style="background:#f0fff4;border:1px solid #2ecc71;border-radius:12px;padding:12px">
<b style="color:#2ecc71;font-size:13px">+ NOVÁ REGISTRÁCIA</b>
<div class="small" style="margin-top:4px">Vytvor novú moderátorku</div>
<button class="btn" style="width:100%;margin-top:8px;border-color:#2ecc71;color:#2ecc71" onclick="showReg()">👉 REGISTROVAŤ NOVÚ</button>
</div>
<div class="small" style="margin-top:12px">Existujúce: <span id="listMods" style="color:#222;font-weight:800"></span></div>
</div>

<div id="regForm" style="display:none">
<h3 style="color:#2ecc71">✅ Nová moderátorka</h3>
<div class="small" style="margin:6px 0 10px">Zaregistruj novú babu do systému</div>
<input id="regMeno" type="text" placeholder="Meno (napr. zuzana)" autocomplete="off">
<input id="regHeslo" type="text" placeholder="Heslo (napr. zuzana123) - vidíš čo píšeš" autocomplete="off">
<input id="regHeslo2" type="text" placeholder="Heslo znova">
<button class="btn green" onclick="doReg()">✅ VYTVORIŤ ÚČET</button>
<button class="btn" style="width:100%;margin-top:8px" onclick="showLogin()">← Späť na login</button>
<div id="regError" style="font-size:13px;margin-top:10px;min-height:20px"></div>
</div>
</div>
</div>

<div class="topbar"><b style="color:#ff2a6d">💋 MODERÁTORKA V5</b><span id="who" class="small" style="font-weight:900"></span><button class="btn" onclick="location.reload()">Odhlásiť</button></div>
<div class="main"><div class="left"><div class="head">Chlapi <span id="cnt"></span></div><div id="userList" style="flex:1;overflow:auto"></div></div><div class="center"><div class="head"><b id="chatTitle">Chat</b></div><div class="chat" id="chatBox"></div><div style="padding:10px;background:#fafafa;border-top:1px solid #eee"><textarea id="msgIn" rows="2" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:10px"></textarea><button id="sendBtn" style="width:100%;margin-top:6px;background:#ff2a6d;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:900">Odoslať ako baba</button></div></div><div class="right"><div style="padding:10px"><button class="btn" style="width:100%" onclick="addTest()">+ Test chlapi</button></div></div></div>

<script>
const DEFAULT_MODS={rene:{heslo:'rene123',jeMajitel:true},nikol:{heslo:'nikol123',jeMajitel:false}};
function getMods(){try{const s=JSON.parse(localStorage.getItem('moderatori')||'{}');return {...DEFAULT_MODS,...s};}catch(e){return {...DEFAULT_MODS};}}
function saveMod(m,d){const s=JSON.parse(localStorage.getItem('moderatori')||'{}');s[m]=d;localStorage.setItem('moderatori',JSON.stringify(s));}
function fill(m,h){document.getElementById('modMeno').value=m;document.getElementById('modHeslo').value=h;document.getElementById('loginError').innerText='Vyplnené: '+m+' / '+h;document.getElementById('loginError').style.color='#2ecc71';}
function showReg(){document.getElementById('loginForm').style.display='none';document.getElementById('regForm').style.display='block';}
function showLogin(){document.getElementById('regForm').style.display='none';document.getElementById('loginForm').style.display='block';updateModsList();}
function updateModsList(){const mods=getMods();document.getElementById('listMods').innerText=Object.keys(mods).join(', ');}
function doReg(){
 const meno=document.getElementById('regMeno').value.toLowerCase().trim();
 const h1=document.getElementById('regHeslo').value.trim();
 const h2=document.getElementById('regHeslo2').value.trim();
 const err=document.getElementById('regError');
 if(!meno||!h1){err.style.color='#ff2a6d';err.innerText='Vyplň meno aj heslo!';return;}
 if(meno.length<3){err.style.color='#ff2a6d';err.innerText='Meno min 3 znaky';return;}
 if(h1.length<4){err.style.color='#ff2a6d';err.innerText='Heslo min 4 znaky';return;}
 if(h1!==h2){err.style.color='#ff2a6d';err.innerText='Heslá sa nezhodujú!';return;}
 const mods=getMods();if(mods[meno]){err.style.color='#ff2a6d';err.innerText='Už existuje: '+meno;return;}
 saveMod(meno,{heslo:h1,jeMajitel:false});err.style.color='#2ecc71';err.innerText='✅ Vytvorená: '+meno+' / '+h1+' - prihlasujem...';
 setTimeout(()=>{showLogin();fill(meno,h1);},800);
}
let ja=null,selChlap=null;
function doLogin(){
 const m=document.getElementById('modMeno').value.toLowerCase().trim();
 const h=document.getElementById('modHeslo').value.trim();
 const mods=getMods();const err=document.getElementById('loginError');
 if(!m||!h){err.style.color='#ff2a6d';err.innerText='Vyplň meno aj heslo!';return;}
 err.style.color='#888';err.innerText='Skúšam '+m+'...';
 if(mods[m]&&mods[m].heslo===h){ja={meno:m,...mods[m]};document.getElementById('login').style.display='none';document.getElementById('who').innerText=m+(ja.jeMajitel?' 👑':'');renderUsers();}
 else{err.style.color='#ff2a6d';err.innerText='❌ Zlé! Existujú: '+Object.keys(mods).join(', ');}
}
const loginBtn=document.getElementById('loginBtn');loginBtn.addEventListener('click',doLogin);loginBtn.addEventListener('touchend',e=>{e.preventDefault();doLogin();},{passive:false});
document.getElementById('modHeslo').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function getUsers(){try{return JSON.parse(localStorage.getItem('spoznajma_users')||'[]')}catch(e){return []}}
function renderUsers(){let users=getUsers();let modsKeys=Object.keys(getMods());users.forEach((u,i)=>{if(!u.assignedTo)u.assignedTo=modsKeys[i%modsKeys.length];});localStorage.setItem('spoznajma_users',JSON.stringify(users));let zobraz=ja&&ja.jeMajitel?users:users.filter(u=>!u.assignedTo||u.assignedTo===ja.meno);document.getElementById('cnt').innerText=zobraz.length;let list=document.getElementById('userList');list.innerHTML='';zobraz.slice().reverse().forEach(u=>{let d=document.createElement('div');d.className='user';d.innerHTML=`<b>${u.meno}</b> ${u.assignedTo}`;d.onclick=()=>{selChlap=u.id;};list.appendChild(d);});}
function addTest(){let u=getUsers();if(u.length===0){u=[{id:'1',meno:'Peter',assignedTo:'rene'},{id:'2',meno:'Ján',assignedTo:'nikol'}];localStorage.setItem('spoznajma_users',JSON.stringify(u));renderUsers();}}
updateModsList();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moderatorka - Kolotoc - Final</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:Inter,ui-sans-serif,system-ui}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:10px}</style>
</head>
<body class="fixed inset-0 w-screen h-screen bg-white flex flex-col overflow-hidden">
<div id="root" class="flex flex-col h-screen"></div>
<script>
const WOMEN = [
  {id:0,name:"Veronika",age:24,city:"Bratislava",photo:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400",desc:"Ahoj, som Veronika, rada spoznávam nových ľudí...",other:"Hľadám úprimné rozhovory."},
  {id:1,name:"Katka",age:27,city:"Košice",photo:"https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=400",desc:"Katka, milujem knihy a hudbu.",other:"Voľný čas v prírode."},
  {id:2,name:"Simona",age:22,city:"Nitra",photo:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400",desc:"Simona 22, študujem.",other:"Mám rada humor."},
  {id:3,name:"Lenka",age:26,city:"Žilina",photo:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400",desc:"Lenka, otvorená duša.",other:"Cestovanie, fotenie."},
  {id:4,name:"Petra",age:25,city:"Trnava",photo:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400",desc:"Petra, pracujem v gastre.",other:"Pokec bez pretvárky."},
];
let menList = [
  {id:0,name:"Jano",age:27,city:"Žilina",credits:44,ip:"192.168.1.42",desc:"Ahoj, som Jano, 27r, Žilina.",other:"Hľadám úprimnú babu.",online:true,registeredAt:"08:14",wroteToWomanId:0,isNew:false},
  {id:1,name:"Peter",age:32,city:"Bratislava",credits:12,ip:"192.168.0.18",desc:"Peter 32, IT.",other:"Mám rád filmy.",online:true,registeredAt:"09:02",wroteToWomanId:1,isNew:false},
  {id:2,name:"Marek",age:29,city:"Košice",credits:88,ip:"10.0.0.5",desc:"Marek, 29, Košice.",other:"Hľadám vážnejšie.",online:false,registeredAt:"10:30",wroteToWomanId:2,isNew:false},
];
let chats = {0:[{from:"man",text:"Ahoj Veronika, ako sa máš dnes? 🙂",time:"12:02"},{from:"woman",text:"Ahoj Janko, mám sa fajn",time:"12:03"}],1:[{from:"man",text:"Čauko, si tu?",time:"11:40"}],2:[{from:"man",text:"Ahoj, môžeme pokecať?",time:"10:15"}]};
let waitingQueue = [{manId:0,womanId:0,time:"12:02"},{manId:1,womanId:1,time:"11:40"}];
let womanIdx=0, manIdx=0, totalSent=0;

function getCurrentMan(){return menList.find(m=>m.id===manIdx)||menList[0];}
function getCurrentWoman(){return WOMEN[womanIdx];}

function render(){
  const cm=getCurrentMan(), cw=getCurrentWoman(), pending=waitingQueue.length;
  const msgs=chats[manIdx]||[];
  document.getElementById('root').innerHTML=`
  <header class="h- bg-[#111] text-white flex items-center justify-between px-3 gap-2">
    <div class="flex items-center gap-2">
      <button onclick="toggleChlapi()" class="h- px-4 rounded-full text- font-black flex items-center gap-2 border bg-[#232323] border-white/10">Chlapi ▼ <span class="min-w- h- px-1 rounded-full bg-white text-black text- flex items-center justify-center">${menList.length}</span></button>
      <button class="h- px-3 rounded-full bg-[#232323] text- font-semibold flex items-center gap-2 border border-white/10">Čakajúce <span class="min-w- h- px-1 rounded-full bg-[#ff2a6d] text-white text- flex items-center justify-center font-black">${pending}</span></button>
    </div>
    <div class="flex items-center gap-2">${WOMEN.map((w,i)=>`<button onclick="setWoman(${i})" class="w-9 h-9 rounded-full overflow-hidden ${womanIdx===i?'ring- ring-[#ff2a6d] ring-offset-2 ring-offset-[#111] scale-105':'opacity-70'}"><img src="${w.photo}" class="w-full h-full object-cover"></button>`).join('')}</div>
    <div class="flex items-center gap-2">
      <button onclick="toggleStats()" class="h-8 px-3 rounded-full bg-[#232323] text-white text- font-semibold border border-white/10">📊 Stats</button>
      <button class="hidden lg:flex h- px-3 rounded-lg bg-[#ff6b6b] text-white text- font-black">PANIC ROOM</button>
      <div class="text- font-bold">tomas</div>
    </div>
  </header>
  <div class="flex flex-1 overflow-hidden bg-white">
    <aside class="w- bg-[#f8f9fa] border-r border-[#e5e7eb] flex flex-col overflow-auto p-4">
      <h3 class="text- font-black tracking-[0.14em] text-[#9ca3af]">CHLAP PROFIL • AKTUÁLNY - bez tabuľky vľavo</h3>
      <div class="flex gap-3 items-start mt-3">
        <div class="w- h- rounded-full bg-[#e5e7eb] flex items-center justify-center text- font-black">${cm.name[0]}</div>
        <div><div class="text- font-bold">${cm.name} ${cm.age} ${cm.isNew?'<span class="px-2 py-0.5 rounded-full bg-[#16a34a] text-white text-">NOVÝ</span>':''}</div><div class="text- text-[#6b7280]">${cm.city} • ${cm.credits} kr • písal ${WOMEN[cm.wroteToWomanId]?.name}</div><div class="text- text-[#9ca3af] mt-1 font-mono">IP: ${cm.ip} • ${cm.registeredAt}</div></div>
      </div>
      <div class="mt-4"><label class="text- font-bold text-[#9ca3af]">DESCRIPTION</label><div class="mt-1 min-h- p-3 rounded-lg bg-[#eef2f7] border text-">${cm.desc}</div></div>
      <div class="mt-3"><label class="text- font-bold text-[#9ca3af]">OTHER</label><div class="mt-1 p-3 rounded-lg bg-[#eef2f7] border text-">${cm.other}</div></div>
      <div class="mt-auto pt-4 text- text-[#9ca3af]">Reálni chlapi - registrácia každých 17s • Kolotoč FIFO • Po odoslaní skočí ďalší čakajúci</div>
    </aside>
    <main class="flex-1 flex flex-col bg-white relative min-w-0 overflow-hidden">
      <div class="h- px-4 flex items-center justify-between border-b bg-white"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-[#f1f5f9] flex items-center justify-center font-bold">${cm.name[0]}</div><div><div class="text- font-bold">Píšeš ako ${cw.name} → ${cm.name} <span class="text- font-black px-2 py-0.5 rounded-full bg-[#7c3aed]/10 text-[#7c3aed]">KOLOTOČ FRONTA</span></div><div class="text- text-[#6b7280]">${cm.name} (${cm.age}) → ${cw.name} (${cw.age}) • Fronta: ${pending} • ${cm.credits} kr</div></div></div></div>
      <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#fcfcfd]" id="msgs">
        ${msgs.map(m=>`<div class="flex flex-col ${m.from==='woman'?'items-end':'items-start'}"><div class="text- font-black mb-1 ${m.from==='woman'?'text-[#ff2a6d]':'text-[#6b7280]'}">${m.from==='woman'?'Ty ako '+cw.name:cm.name+' → '+WOMEN[cm.wroteToWomanId]?.name}</div><div class="max-w-[72%] rounded- px-4 py-2.5 text- ${m.from==='woman'?'bg-[#ff2a6d] text-white rounded-br-':'bg-[#f1f5f9] text-[#111] rounded-bl- border'}"><div>${m.text}</div><div class="text- mt-1 opacity-70">${m.time}</div></div></div>`).join('')}
      </div>
      <div class="h- px-3 flex items-center gap-2 border-t bg-white">
        <button onclick="document.getElementById('emojiBox').classList.toggle('hidden')" class="w-10 h-10 rounded-full border bg-white">😊</button>
        <input id="msgInput" onkeydown="if(event.key==='Enter')sendMsg()" placeholder="Send a message" class="flex-1 h- px-4 rounded-full bg-[#f3f4f6] border text- outline-none">
        <button onclick="sendMsg()" class="h- px-5 rounded-xl bg-[#7c3aed] text-white font-[800] text-">SEND MESSAGE</button>
      </div>
      <div id="emojiBox" class="hidden absolute bottom- left-4 w- bg-white border rounded-2xl shadow p-3 grid grid-cols-8 gap-1">${["😊","😍","😘","🥰","😂","❤️","💋","🔥","✨","🌹","☕","🍷","👋"].map(e=>`<button onclick="document.getElementById('msgInput').value+= '${e}'" class="h-8 w-8 hover:bg-gray-100 rounded">${e}</button>`).join('')}</div>
    </main>
    <aside class="w- bg-[#f8f9fa] border-l border-[#e5e7eb] flex flex-col overflow-auto">
      <div class="p-4"><h3 class="text- font-black tracking-[0.14em] text-[#9ca3af]">ŽENA PROFIL</h3>
        <div class="mt-2 rounded- overflow-hidden bg-white border shadow-sm"><div class="h- relative"><img src="${cw.photo}" class="w-full h-full object-cover"><div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-3"><div class="text-white font-bold text-">${cw.name}, ${cw.age}</div><div class="text-white/80 text-">${cw.city}</div></div><div class="absolute top-3 right-3 w-3 h-3 rounded-full bg-[#10b981] border-2 border-white"></div></div><div class="p-3 space-y-2"><div class="text- text-[#4b5563]">${cw.desc}</div><div class="text- text-[#9ca3af]">${cw.other}</div></div></div>
        <div class="mt-4 flex gap-1">${WOMEN.map(w=>`<div class="flex-1 h-1.5 rounded-full ${womanIdx===w.id?'bg-[#ff2a6d]':'bg-[#e5e7eb]'}"></div>`).join('')}</div>
      </div>
    </aside>
  </div>
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#111] text-white text- font-semibold px-5 py-3 rounded-full shadow hidden z-[100]"></div>
  <div id="chlapiModal" class="fixed inset-0 z-[70] hidden"><div class="absolute inset-0 bg-[rgba(0,0,0,0.75)] backdrop-blur" onclick="toggleChlapi()"></div><div class="relative flex items-center justify-center h-full p-6"><div class="w- max-w- max-h- rounded- border bg-[rgba(18,18,18,0.95)] text-white flex flex-col overflow-hidden"><div class="flex items-center justify-between px-6 py-4 border-b border-white/10"><h3 class="text- font-black">Chlapi • Tabuľka len na lište • ${menList.length} chlapov • každý registrovaný</h3><button onclick="toggleChlapi()" class="w-8 h-8 rounded-full bg-white/10">✕</button></div><div class="flex-1 overflow-auto"><div class="min-w-"><div class="grid grid-cols-[1.3fr_0.4fr_0.8fr_1fr_0.8fr_0.5fr_0.7fr_0.9fr] gap-2 px-6 py-3 bg-black/50 text- font-black text-white/40 uppercase"><div>Meno</div><div>Vek</div><div>Mesto</div><div>Písal žene</div><div>Status</div><div>Kredity</div><div>Čas registrácie</div><div>Akcia</div></div>${menList.map(m=>`<div class="grid grid-cols-[1.3fr_0.4fr_0.8fr_1fr_0.8fr_0.5fr_0.7fr_0.9fr] gap-2 px-6 py-3 items-center border-b border-white/[0.04] ${m.isNew?'bg-[#16a34a]/10':''}"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center font-black">${m.name[0]}</div><div>${m.name} ${m.isNew?'<span class="px-1.5 py-0.5 rounded-full bg-[#16a34a] text-white text-">NOVÝ</span>':''}</div></div><div>${m.age}</div><div>${m.city}</div><div><span class="px-2 py-1 rounded-full bg-[#ff2a6d]/15 text-[#ff8fae] text-">${WOMEN[m.wroteToWomanId]?.name}</span></div><div>${m.online?'Prihlásený':'Odhlásený'}</div><div>${m.credits} kr</div><div>${m.registeredAt}</div><div><button onclick="openMan(${m.id});toggleChlapi()" class="h- px-3.5 rounded-full bg-[#7c3aed] text-white text- font-black">Otvoriť →</button></div></div>`).join('')}</div></div></div></div></div></div>
  <div id="statsModal" class="fixed inset-0 z-[60] hidden"><div class="absolute inset-0 bg-[rgba(0,0,0,0.7)] backdrop-blur" onclick="toggleStats()"></div><div class="relative flex items-center justify-center h-full p-4"><div class="w- max-w- rounded- border border-white/15 bg-[rgba(17,17,17,0.85)] backdrop-blur p-7 text-white"><div class="flex justify-between"><h3 class="text- font-black">📊 Stats • TOMÁŠ • MAJITEĽ - DEŇ/TÝŽDEŇ/MESIAC + všetky chlapi platia</h3><button onclick="toggleStats()" class="w-9 h-9 rounded-full bg-white/10">✕</button></div><div class="mt-5 grid grid-cols-3 gap-3"><div class="rounded- p-5 bg-gradient-to-br from-[#fbbf24]/20 to-[#f59e0b]/10 border border-[#fbbf24]/30"><div class="text- font-bold tracking-widest text-[#fbbf24]">DEŇ</div><div class="text- font-black mt-1">48 kr / 24€</div><div class="text- text-white/60">32 správ • priemer 1.5 kr</div></div><div class="rounded- p-5 bg-white/[0.06] border"><div class="text- font-bold tracking-widest text-white/40">TÝŽDEŇ</div><div class="text- font-black mt-1">320 kr / 160€</div><div class="text- text-white/60">210 správ</div></div><div class="rounded- p-5 bg-white/[0.06] border"><div class="text- font-bold tracking-widest text-white/40">MESIAC</div><div class="text- font-black mt-1">1240 kr / 620€</div><div class="text- text-white/60">890 správ</div></div></div><div class="mt-4 p-4 rounded-xl bg-black/30 border">Reálni chlapi: každý registrovaný automaticky napíše žene → kolotoč FIFO 800ms • Fronta: ${waitingQueue.length} • Dnes: ${menList.length} • Kredity sa strhávajú za správu (chlap platí)</div></div></div></div>
  `;
  document.getElementById('msgs')?.scrollTo(0,99999);
}

function setWoman(i){womanIdx=i;render();}
function openMan(id){manIdx=id; const m=menList.find(x=>x.id===id); if(m) womanIdx=m.wroteToWomanId; render();}
function toggleChlapi(){document.getElementById('chlapiModal').classList.toggle('hidden');}
function toggleStats(){document.getElementById('statsModal').classList.toggle('hidden');}
function showToast(t){const el=document.getElementById('toast'); el.textContent=t; el.classList.remove('hidden'); setTimeout(()=>el.classList.add('hidden'),2800);}

function sendMsg(){
  const inp=document.getElementById('msgInput'); const txt=inp.value.trim(); if(!txt) return;
  const cm=getCurrentMan();
  chats[manIdx]=[...(chats[manIdx]||[]),{from:"woman",text:txt,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}];
  cm.credits=Math.max(0,cm.credits-1); waitingQueue=waitingQueue.filter(q=>q.manId!==manIdx); render();
  setTimeout(()=>{
    if(waitingQueue.length===0){showToast("Žiadni ďalší čakajúci - čakáme na nových chlapov");return;}
    const next=waitingQueue[0]; const nm=menList.find(m=>m.id===next.manId); const nw=WOMEN[next.womanId];
    if(!nm||!nw) return; manIdx=next.manId; womanIdx=next.womanId; render(); showToast(`Kolotoč: ${nm.name} ${nm.age} → ${nw.name} (čakajúca správa)`);
  },800);
}

// simulácia reálnych registrácií - každý nový chlap píše žene
setInterval(()=>{
  const names=["Lukáš","Martin","Tomáš","Jakub","Filip","Matej"]; const cities=["Trnava","Nitra","Banská Bystrica","Prešov","Košice","Žilina","Bratislava"];
  const name=names[Math.floor(Math.random()*names.length)], city=cities[Math.floor(Math.random()*cities.length)], age=22+Math.floor(Math.random()*24);
  const womanId=Math.floor(Math.random()*WOMEN.length), id=menList.length?Math.max(...menList.map(m=>m.id))+1:0;
  const newMan={id,name,age,city,credits:10+Math.floor(Math.random()*90),ip:`10.${Math.floor(Math.random()*200)}`,desc:`${name}, ${age}r, ${city}.`,other:`Nový - napísal ${WOMEN[womanId].name}`,online:true,registeredAt:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),wroteToWomanId:womanId,isNew:true};
  menList=[newMan,...menList]; chats[id]=[{from:"man",text:["Ahoj, si tu? :)","Čauko, môžeme pokecať?","Ahoj, páčiš sa mi"][Math.floor(Math.random()*3)],time:new Date().toLocaleTimeString()}]; waitingQueue=[...waitingQueue,{manId:id,womanId,time:new Date().toLocaleTimeString()}];
  render(); showToast(`Nový chlap sa zaregistroval: ${name} ${age} ${city}`); setTimeout(()=>{newMan.isNew=false;render();},45000);
},17000);

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moderator V5</title>
<style>body{background:#fff;color:#222;font-family:sans-serif;padding:20px}input{width:100%;padding:16px;margin:6px 0;border:2px solid #ddd;border-radius:12px;font-size:18px}button{width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer}.pink{background:#ff2a6d;color:#fff}.green{background:#2ecc71;color:#fff}.box{max-width:360px;margin:40px auto;padding:24px;border:1px solid #eee;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}.small{font-size:12px;color:#888;margin-top:8px}</style>
</head><body>
<div class="box" id="loginBox">
<h2 style="color:#ff2a6d">💋 Login V5 - REG</h2>
<div class="small">Verzia s registráciou</div>
<input id="m" placeholder="meno rene">
<input id="h" type="password" placeholder="heslo rene123">
<button class="pink" onclick="login()">PRIHLÁSIT SA</button>
<div id="err" style="color:red;margin-top:10px"></div>
<button onclick="fill('rene')" style="margin-top:10px;background:#eee">Vyplň rene</button>
<button onclick="fill('nikol')" style="background:#eee;margin-top:6px">Vyplň nikol</button>
<hr style="margin:16px 0">
<div style="background:#f0fff4;padding:12px;border-radius:12px;border:1px solid #2ecc71">
<b style="color:#2ecc71">+ Nová registrácia</b><br>
<button class="green" style="margin-top:8px" onclick="showReg()">REGISTROVAT NOVU</button>
</div>
<div class="small">Existuju: <span id="list"></span></div>
</div>

<div class="box" id="regBox" style="display:none">
<h2 style="color:#2ecc71">Registracia</h2>
<input id="rm" placeholder="nove meno napr zuzana">
<input id="rh" placeholder="nove heslo">
<input id="rh2" placeholder="heslo znova">
<button class="green" onclick="reg()">VYTVORIT UCET</button>
<button style="margin-top:8px;background:#eee" onclick="showLogin()">Spat na login</button>
<div id="rerr" style="margin-top:10px"></div>
</div>

<div class="box" id="app" style="display:none">
<h2>Vitaj <span id="who"></span></h2>
<button onclick="location.reload()" style="background:#eee">Odhlasit</button>
<hr style="margin:12px 0">
<button onclick="addTest()">+ Pridat test chlapov</button>
<div id="users" style="margin-top:12px"></div>
</div>

<script>
const DEF={rene:{h:'rene123',maj:true},nikol:{h:'nikol123',maj:false}};
function getMods(){try{let s=JSON.parse(localStorage.getItem('mods')||'{}');return {...DEF,...s}}catch(e){return DEF}}
function saveMod(m,d){let s=JSON.parse(localStorage.getItem('mods')||'{}');s[m]=d;localStorage.setItem('mods',JSON.stringify(s));listMods()}
function fill(n){let mods=getMods();document.getElementById('m').value=n;document.getElementById('h').value=mods[n]?mods[n].h:n+'123'}
function listMods(){document.getElementById('list').innerText=Object.keys(getMods()).join(', ')}
function showReg(){document.getElementById('loginBox').style.display='none';document.getElementById('regBox').style.display='block'}
function showLogin(){document.getElementById('regBox').style.display='none';document.getElementById('loginBox').style.display='block';listMods()}
function reg(){
 let m=document.getElementById('rm').value.toLowerCase().trim();
 let h1=document.getElementById('rh').value.trim();
 let h2=document.getElementById('rh2').value.trim();
 let e=document.getElementById('rerr');
 if(!m||!h1){e.innerText='Vypln meno a heslo';e.style.color='red';return}
 if(h1!=h2){e.innerText='Hesla sa nezhoduju';e.style.color='red';return}
 if(getMods()[m]){e.innerText='Uz existuje';e.style.color='red';return}
 saveMod(m,{h:h1,maj:false});e.innerText='Vytvorena: '+m;e.style.color='green';
 setTimeout(()=>{showLogin();document.getElementById('m').value=m;document.getElementById('h').value=h1},800)
}
function login(){
 let m=document.getElementById('m').value.toLowerCase().trim();
 let h=document.getElementById('h').value.trim();
 let mods=getMods();
 let e=document.getElementById('err');
 if(!mods[m]||mods[m].h!=h){e.innerText='Zle! Skus: '+Object.keys(mods).join(', ');return}
 document.getElementById('loginBox').style.display='none';
 document.getElementById('app').style.display='block';
 document.getElementById('who').innerText=m+(mods[m].maj?' 👑 majitel':'');
 render()
}
function getUsers(){try{return JSON.parse(localStorage.getItem('users')||'[]')}catch(e){return []}}
function render(){let u=getUsers();document.getElementById('users').innerHTML=u.length?u.map(x=>'<div>'+x.meno+' -> '+x.assigned+'</div>').join(''):'Ziadni chlapi'}
function addTest(){let u=getUsers();if(u.length==0){u=[{meno:'Peter',assigned:'rene'},{meno:'Jan',assigned:'nikol'}];localStorage.setItem('users',JSON.stringify(u));render()}}
listMods()
</script>
</body></html>
